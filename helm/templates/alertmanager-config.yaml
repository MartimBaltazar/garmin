{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-garmin-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    {{- include "garmin.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    route:
      receiver: 'slack'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'pagerduty'
          match:
            severity: critical
        - receiver: 'whatsapp'
          match_re:
            severity: warning
    receivers:
      - name: 'slack'
        slack_configs:
          - api_url: '{{ .Values.alerting.slackWebhookURL }}'
            channel: '#garmin-alerts'
            title: 'Garmin alert'
            text: 'Garmin alert triggered'
            send_resolved: true
      - name: 'pagerduty'
        pagerduty_configs:
          - service_key: '{{ .Values.alerting.pagerDutyServiceKey }}'
            send_resolved: true
      - name: 'whatsapp'
        webhook_configs:
          - url: '{{ .Values.alerting.whatsappWebhookURL }}'
            send_resolved: true
            # WhatsApp is not a native Alertmanager receiver. This webhook
            # expects a small gateway service that calls the WhatsApp Business
            # API (e.g. Twilio, MessageBird, or CallMeBot).
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname']
{{- end }}
