{{- if .Values.alertmanager.enabled }}
{{/* deploy/config/alertmanager.yaml, copied verbatim by `make chart-sync`. The
     only difference under Helm is the gateway's Service name, which carries the
     release prefix, so that one hostname is rewritten here. */}}
{{- $kustomizeHost := "whatsapp-gateway.garmin.svc.cluster.local" }}
{{- $chartHost := printf "%s-whatsapp-gateway.%s.svc.cluster.local" .Release.Name .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-garmin-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    {{- include "garmin.labels" . | nindent 4 }}
data:
  alertmanager.yml: |-
{{ .Files.Get "config/alertmanager.yaml" | replace $kustomizeHost $chartHost | indent 4 }}
{{- end }}
