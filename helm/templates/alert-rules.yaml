{{- if .Values.vmalert.enabled }}
{{/* Rules are deploy/config/alert-rules.yaml, copied verbatim by `make chart-sync`.
     .Files.Get (not tpl), so the rules' own {{ $value }} templates pass through. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-garmin-alert-rules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garmin-exporter
    {{- include "garmin.labels" . | nindent 4 }}
data:
  alert-rules.yml: |-
{{ .Files.Get "config/alert-rules.yaml" | indent 4 }}
{{- end }}
