{{- if .Values.whatsappGateway.enabled }}
{{/* Mirrors deploy/80-whatsapp-gateway.yaml. Secrets (alert-webhook-token,
     whatsapp-credentials) are referenced by name and never rendered. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-whatsapp-gateway-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: whatsapp-gateway
    {{- include "garmin.labels" . | nindent 4 }}
data:
  whatsapp-gateway.py: |-
{{ .Files.Get "config/whatsapp-gateway.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-whatsapp-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: whatsapp-gateway
    {{- include "garmin.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/script: {{ .Files.Get "config/whatsapp-gateway.py" | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.whatsappGateway.image }}
          command: ["python", "-I", "/app/whatsapp-gateway.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-webhook-token
                  key: webhook-token
                  # Missing token = gateway rejects everything (and says so in
                  # its log), rather than a pod stuck in CreateContainerConfigError.
                  optional: true
            - name: WHATSAPP_PHONE
              valueFrom:
                secretKeyRef:
                  name: whatsapp-credentials
                  key: phone
                  optional: true
            - name: WHATSAPP_APIKEY
              valueFrom:
                secretKeyRef:
                  name: whatsapp-credentials
                  key: apikey
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-whatsapp-gateway-script
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whatsapp-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: whatsapp-gateway
    {{- include "garmin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whatsapp-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
