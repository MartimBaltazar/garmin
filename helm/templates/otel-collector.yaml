{{/* OTel Collector: Deployment (ConfigMap from files/) + Service. Pass-through config only. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    {{- include "garmin.labels" . | nindent 4 }}
  annotations:
    # A content-hash annotation documents the config the chart shipped; the
    # pod-level checksum below and a `helm upgrade` do the actual rolling.
    checksum/config: {{ .Files.Get "config/collector.yaml" | sha256sum }}
data:
{{ (.Files.Glob "config/collector.yaml").AsConfig | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    {{- include "garmin.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ .Files.Get "config/collector.yaml" | sha256sum }}
    spec:
      securityContext:
        {{- include "garmin.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: otel-collector
          image: {{ .Values.otelcollector.image }}
          args: ["--config=/conf/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.otelcollector.resources | nindent 12 }}
          securityContext:
            {{- include "garmin.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    {{- include "garmin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
