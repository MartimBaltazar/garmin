# The live exporter: every 30 minutes, fetch the trailing window and push it
# over OTLP.
#
# No credentials in the cluster. The CronJob resumes from the token file on the
# PVC; GARMIN_EMAIL/GARMIN_PASSWORD exist only for the one-off interactive
# login, which needs a terminal to answer Garmin's MFA challenge. If the cached
# tokens are ever rejected, the run fails loudly and the "no success in 6h"
# alert fires -- which is the correct outcome, because a CronJob cannot answer
# MFA anyway. See docs/runbook.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-tokens
  namespace: garmin
  labels:
    app.kubernetes.io/name: garmin-exporter
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garmin-exporter
  namespace: garmin
  labels:
    app.kubernetes.io/name: garmin-exporter
    app.kubernetes.io/part-of: garmin-observability
spec:
  # Every 30 minutes. Garmin's own rate limiting, not this schedule, is the
  # real constraint; the exporter also enforces GARMIN_REQUEST_PAUSE_SECONDS.
  schedule: "*/30 * * * *"
  # A slow run must not overlap the next one: two exporters refreshing the same
  # token file would invalidate each other's session.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The volume starts owned by root and the hostPath provisioner does
            # not apply fsGroup, so the non-root container could not write the
            # refreshed token file back.
            - name: init-permissions
              image: busybox:1.37.0
              command: ["sh", "-c", "chown -R 10001:10001 /var/lib/garmin/tokens"]
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
              volumeMounts:
                - name: tokens
                  mountPath: /var/lib/garmin/tokens
          containers:
            - name: exporter
              # Built locally and loaded into minikube by `make image-load`.
              # The Helm chart in Phase 4 replaces this with a registry image.
              image: garmin-exporter:dev
              imagePullPolicy: IfNotPresent
              args: ["run"]
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector.garmin.svc.cluster.local:4317
                - name: OTEL_EXPORTER_OTLP_INSECURE
                  value: "true"
                - name: GARMIN_EMIT
                  value: otlp
                - name: GARMIN_TOKENSTORE
                  value: /var/lib/garmin/tokens
                - name: GARMIN_LOOKBACK_DAYS
                  value: "2"
                - name: GARMIN_REQUEST_PAUSE_SECONDS
                  value: "1.5"
                - name: GARMIN_VM_URL
                  value: http://victoriametrics.garmin.svc.cluster.local:8428
                - name: LOG_LEVEL
                  value: INFO
              volumeMounts:
                - name: tokens
                  mountPath: /var/lib/garmin/tokens
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tokens
              persistentVolumeClaim:
                claimName: garmin-tokens
