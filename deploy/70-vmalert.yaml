# vmalert: evaluates alert rules against VictoriaMetrics, fires to Alertmanager.
#
# Reads /etc/vmalert/rules/alert-rules.yml (mounted from the garmin-alert-rules
# ConfigMap) and sends firing/resolved alerts to
# http://alertmanager.garmin.svc.cluster.local:9093.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmalert
  namespace: garmin
  labels:
    app.kubernetes.io/name: vmalert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: garmin
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: garmin-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      serviceAccountName: vmalert
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.155.0
          args:
            - --datasource.url=http://victoriametrics.garmin.svc.cluster.local:8428
            - --notifier.url=http://alertmanager.garmin.svc.cluster.local:9093
            - --rule=/etc/vmalert/rules/alert-rules.yml
            - --external.url=http://vmalert.garmin.svc.cluster.local:8880
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rules
          configMap:
            name: garmin-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: garmin
  labels:
    app.kubernetes.io/name: vmalert
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
