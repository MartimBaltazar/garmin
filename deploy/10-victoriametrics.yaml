# VictoriaMetrics, single node.
#
# The one flag that matters: -retentionPeriod=10y. The default is one month,
# which would silently discard the backfill a few weeks after it ran -- the
# worst possible failure mode, because the dashboard still looks healthy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-data
  namespace: garmin
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: garmin
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: garmin-observability
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the volume is ReadWriteOnce, so the old pod
  # has to release it before the new one can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # The image runs as root and the volume starts owned by root, so the
        # non-root main container could not write to it. The hostPath
        # provisioner does not apply fsGroup, hence this.
        - name: init-permissions
          image: busybox:1.37.0
          command: ["sh", "-c", "chown -R 1000:1000 /victoria-metrics-data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.155.0
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=10y
            - -httpListenAddr=:8428
            - -loggerOutput=stdout
            - -loggerLevel=INFO
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriametrics-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: garmin
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: http
