# Local development deployment. Phase 4 replaces this with a Helm chart, but
# these manifests are the contract: if the Helm chart cannot reproduce them,
# the chart is wrong.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: garmin

resources:
  - 00-namespace.yaml
  - 10-victoriametrics.yaml
  - 20-otel-collector.yaml
  - 30-grafana.yaml
  - 40-exporter-cronjob.yaml

configMapGenerator:
  # The generated name carries a content hash, so a config change rolls the
  # Collector instead of leaving the previous config running.
  - name: otel-collector-config
    files:
      - collector.yaml=config/collector.yaml
  # Dashboards are generated from files too. The Grafana Deployment mounts a
  # ConfigMap with this exact name, so the hash suffix must be off -- dashboards
  # mount into a directory, and a name change would leave the old mount
  # dangling rather than rolling the Deployment. (New dashboard *data* still
  # reaches Grafana because the file provider rescans every 30s.)
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: grafana
    files:
      - dashboard.json=config/dashboard-garmin.json
