# Alertmanager: receives alerts from vmalert and sends them to WhatsApp via the
# gateway in 80-whatsapp-gateway.yaml.
#
# Config is injected via the garmin-alertmanager ConfigMap (see kustomization.yaml).
# Alertmanager has no native WhatsApp integration; see docs/runbook.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: garmin
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: garmin
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: garmin-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=0.0.0.0:9093
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            - name: tmp
              mountPath: /tmp
            # Bearer token for the WhatsApp gateway (credentials_file in
            # alertmanager.yaml). Created by `make secret`.
            - name: webhook-token
              mountPath: /etc/alertmanager-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-token
          secret:
            secretName: alert-webhook-token
            # Alertmanager still starts without it; notifications then fail
            # with a clear "no such file" error instead of the pod crashlooping.
            optional: true
        - name: config
          configMap:
            name: garmin-alertmanager
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: garmin
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
