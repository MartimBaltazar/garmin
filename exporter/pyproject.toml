[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "garmin-exporter"
version = "0.1.0"
description = "Garmin Connect to OpenTelemetry/VictoriaMetrics exporter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Pinned floors, not ceilings: the 0.3.x line removed garth and changed the
    # token format, so an older release will not work with these calls.
    "garminconnect>=0.3.0",
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    # The OTLP protocol is spoken directly (see garmin_exporter.otlp) because
    # the SDK's gauge API cannot carry per-datapoint event timestamps, and the
    # Collector is the only thing that needs to understand them.
    "opentelemetry-proto>=1.27",
    "grpcio>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
garmin-exporter = "garmin_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
